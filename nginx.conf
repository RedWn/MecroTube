server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  root /home/redwn/Prog/MecroTubeVibe/dist;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:4322;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed assets: safe to cache forever (filename changes on every build).
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # HTML pages must never be cached: they reference hashed asset filenames,
  # so a cached page from a previous deploy would request bundles that no
  # longer exist and render a blank page.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ $uri/index.html =404;
  }
}
